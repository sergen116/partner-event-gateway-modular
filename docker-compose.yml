services:
  postgres:
    # Tembo's pgmq image bundles pgmq + pg_partman + the bgw config baked in.
    image: quay.io/tembo/pg17-pgmq:latest
    container_name: peg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peg-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: events
      DB_USER: postgres
      DB_PASS: postgres
      APP_RUNTIME_MODE: CONSUMER_ALL
    ports:
      - "8080:8080"
    profiles:
      - app   # opt-in via `docker compose --profile app up`

volumes:
  postgres-data:
