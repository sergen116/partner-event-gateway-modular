# Prometheus alert rules for partner-event-gateway.
#
# Source-of-truth file. Not loaded by the app. Import into your Prometheus
# rule_files config (or your prometheus-operator PrometheusRule CR) at deploy
# time.
#
# Metric names match Micrometer's Prometheus-registry exposition (underscored)
# as served by /actuator/prometheus.
groups:
  - name: partner-event-gateway.hikari
    rules:
      - alert: HikariPoolPending
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: warning
          service: partner-event-gateway
        annotations:
          summary: "Hikari pool has waiters (pod {{ $labels.pod }})"
          description: |
            {{ $value }} thread(s) have been waiting on the Hikari pool for
            >2m. Brief blips during a worker batch are normal; sustained
            pending means the pool ceiling is too low for current load.
            Check active connections, downstream latency, and whether
            HIKARI_MAX needs to be raised for this role.

      - alert: HikariConnectionTimeouts
        expr: increase(hikaricp_connections_timeout_total[5m]) > 0
        labels:
          severity: critical
          service: partner-event-gateway
        annotations:
          summary: "Hikari connection acquisition timeouts (pod {{ $labels.pod }})"
          description: |
            At least one caller waited longer than connection-timeout (5s)
            and was rejected. Ingest requests fail fast when this happens.
            Investigate immediately: pool exhaustion, slow queries holding
            connections, or downstream timeouts pinning transactions.
