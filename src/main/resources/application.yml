spring:
  application:
    name: partner-event-gateway

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:events}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    # Connection budget (CONSUMER_ALL, worst-case in-flight):
    #   24 worker permits (8+6+4+2+4) + ~10 API + 1 outbox + 1 metrics
    #   ≈ 36 → 40 default leaves ~4 headroom. Override per-pod via HIKARI_MAX.
    #   Split-role pods (API, CONSUMER_<TYPE>) sit far below this — see
    #   docs/ARCHITECTURE.md "Connection budget".
    hikari:
      maximum-pool-size: ${HIKARI_MAX:40}
      minimum-idle: 5
      connection-timeout: 5000
      leak-detection-threshold: 30000
      # PgBouncer transaction mode compatibility (no-op with direct Postgres):
      auto-commit: true
      data-source-properties:
        prepareThreshold: 0

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, circuitbreakers, retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: partner-event-gateway
      role: ${APP_RUNTIME_MODE:CONSUMER_ALL}
  # Tracing: spans are always created and trace_id / span_id always flow
  # into MDC, regardless of whether they're exported. The OTLP exporter is
  # only registered when an endpoint is set — leave it unset locally to
  # avoid connect-refused noise; in deployed envs set
  #   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://<collector>:4318/v1/traces
  # to enable W3C span export.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:#{null}}
      transport: http

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  runtime:
    # API | CONSUMER_ALL | CONSUMER_ORDER_CREATED | CONSUMER_SHIPMENT_UPDATED |
    # CONSUMER_RETURN_REQUESTED | CONSUMER_ADDRESS_UPDATED | CONSUMER_ORDER_CANCELLED
    mode: ${APP_RUNTIME_MODE:CONSUMER_ALL}

  security:
    timestamp-skew: 5m
    algorithm: HmacSHA256
    headers:
      partner-id: X-Partner-Id
      timestamp: X-Timestamp
      signature: X-Signature
      idempotency-key: Idempotency-Key

  consumer:
    poll-interval-ms: 500
    batch-size: 10
    visibility-timeout-seconds: 30
    max-attempts: 5
    concurrency:
      events_order_created: 8
      events_shipment_updated: 6
      events_return_requested: 4
      events_address_updated: 2
      events_order_cancelled: 4

  # Stub downstream system that EventProcessor handlers notify. Override per env.
  downstream:
    base-url: ${DOWNSTREAM_BASE_URL:http://localhost:9999}
    connect-timeout: 1s
    read-timeout: 2s

# Resilience4j: applied to DownstreamCallService.notify() via annotations.
# Retry budget (max-attempts × wait × multiplier) must stay << pgmq
# visibility-timeout-seconds (30s) minus the 5s safety buffer enforced in
# PgmqWorker.processBatch.
resilience4j:
  circuitbreaker:
    instances:
      downstream:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          # Caller bug — shouldn't push the breaker toward OPEN.
          - org.springframework.web.client.HttpClientErrorException
  retry:
    instances:
      downstream:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
        ignore-exceptions:
          # 4xx is a caller bug, not transient — don't feed the breaker.
          - org.springframework.web.client.HttpClientErrorException

logging:
  level:
    com.example.peg: INFO
    org.flywaydb: INFO
